<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="gCinta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="15" fill="url(#gCinta)" />
  <g fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(150, 75)">
    <!-- Tape Roll Icon -->
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="40" />
    <!-- Inner hole core -->
    <circle cx="50" cy="50" r="20" />
    <!-- Tape thickness ridges -->
    <circle cx="50" cy="50" r="32" stroke-dasharray="4 8" />
    <!-- Tape tail peeling off -->
    <path d="M 80 76 L 105 90 M 87 70 L 105 82" stroke-width="3" />
    <path d="M 105 90 L 110 82" />
  </g>
  <text x="50%" y="240" font-family="'Poppins', sans-serif" font-weight="700" font-size="22" fill="#FFFFFF" text-anchor="middle">EMBALAJE</text>
  <text x="50%" y="270" font-family="'Poppins', sans-serif" font-size="15" fill="#EDE9FE" text-anchor="middle" opacity="0.8">Cintas Adhesivas</text>
</svg>
